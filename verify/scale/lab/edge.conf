# 手元の通し（verify/scale/lab）のエッジの代わり。本物のエッジと同じ radsecproxy のイメージ（radsec-edge/radsecproxy:1.11.4-pc1）で、
# AP の役（scaleload）から RadSec（TLS）で受け、テナントの刻印（Vendor-Specific 32473/1、値は "42"）を付けて aka-radius の auth・acct へ UDP で送る。
# 本物のエッジはテナントごとに証明書・CRL・送信元の範囲を持つが、ここでは道具の確かめのために 1 つの client ブロックで受ける（CRL なし）。
ListenTLS *:2083
LogLevel 3
tls default {
    CACertificateFile /pki/ca.pem
    CertificateFile /pki/edge.pem
    CertificateKeyFile /pki/edge.key
    TlsVersion TLS1_2:TLS1_3
}
rewrite stamp {
    removeVendorAttribute 32473:1
    addVendorAttribute 32473:1:'42
}
client aps {
    type tls
    host 0.0.0.0/0
    tls default
    certificateNameCheck off
    rewriteIn stamp
}
server auth {
    type udp
    host auth
    port 1812
    secret scale-edge-secret-0123456789
}
server acct {
    type udp
    host acct
    port 1813
    secret scale-edge-secret-0123456789
}
realm * {
    server auth
    accountingServer acct
}
