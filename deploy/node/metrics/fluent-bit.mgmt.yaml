# 管理面の Fluent Bit に、ログの event_id ごとの行数を数える処理と、Prometheus が取る口を足す（docs/deployment.md §9.5、確認事項 K6-2・K6-3）。
# aka-provisioner のリポジトリの設定（configs/fluent-bit/fluent-bit.yaml）を includes で読み、ここでは足すだけ。
# /opt/aka-node/metrics/ に置き、compose.mgmt.yaml で /fluent-bit/etc/metrics.yaml としてマウントする。
#
# 数（counter）: aka_ossbss_log_events_total・aka_provisioner_log_events_total（ラベルは event_id・level）。
# エッジの反映の失敗（RADSEC_APPLY_FAILED）と反映し直しの止まり（RADSEC_ROLLOUT_STOPPED）の警告に使う。
# 5 秒ごとにまとめて出す理由と、起動し直すと 0 から数え直すことは fluent-bit.data.yaml と同じ。
includes:
  - /fluent-bit/etc/fluent-bit.yaml

pipeline:
  inputs:
    - name: fluentbit_metrics
      tag: aka_metrics
      scrape_interval: 30

  filters:
    - name: log_to_metrics
      alias: metrics_ossbss
      match: app.ossbss
      tag: aka_metrics
      metric_mode: counter
      metric_namespace: aka
      metric_subsystem: ossbss
      metric_name: log_events_total
      metric_description: aka-ossbss のログの event_id ごとの行数
      regex: event_id ^[A-Z0-9_]+$
      label_field:
        - event_id
        - level
      flush_interval_sec: 5

    - name: log_to_metrics
      alias: metrics_provisioner
      match: app.provisioner
      tag: aka_metrics
      metric_mode: counter
      metric_namespace: aka
      metric_subsystem: provisioner
      metric_name: log_events_total
      metric_description: aka-provisioner のログの event_id ごとの行数
      regex: event_id ^[A-Z0-9_]+$
      label_field:
        - event_id
        - level
      flush_interval_sec: 5

  outputs:
    - name: prometheus_exporter
      match: aka_metrics
      host: 0.0.0.0
      port: 2021
