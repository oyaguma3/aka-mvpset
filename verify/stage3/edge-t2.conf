# エッジの代わり（テナント 2）。edge-t1.conf と同じ作りで、刻印の値だけが違う。
ListenUDP *:1812
ListenUDP *:1813
LogLevel 3
rewrite stamp {
    removeVendorAttribute 32473:1
    addVendorAttribute 32473:1:'2
}
client ap {
    type udp
    host 0.0.0.0/0
    secret ap-secret-0123456789
    rewriteIn stamp
}
server auth {
    type udp
    host auth
    port 1812
    secret edge-t2-secret-0123456789
}
server acct {
    type udp
    host acct
    port 1813
    secret edge-t2-secret-0123456789
}
realm * {
    server auth
    accountingServer acct
}
