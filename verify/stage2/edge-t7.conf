# エッジの代わり（テナント 7）。AP の役（eapaka_test・radclient）から UDP で受け、
# テナントの刻印（Vendor-Specific 32473/1、値は "7"）を付けて、aka-radius の auth・acct へ UDP で送る。
# 本物のエッジは RadSec（TLS）で受けるが、刻印の付け方（client ブロックの rewriteIn）は同じ（verify/r10 の V 群）。
ListenUDP *:1812
ListenUDP *:1813
LogLevel 3
# rewrite のブロックは、使う client のブロックより前に書く
rewrite stamp {
    removeVendorAttribute 32473:1
    addVendorAttribute 32473:1:'7
}
client ap {
    type udp
    host 0.0.0.0/0
    secret ap-secret-0123456789
    rewriteIn stamp
}
server auth {
    type udp
    host auth
    port 1812
    secret edge-t7-secret-0123456789
}
server acct {
    type udp
    host acct
    port 1813
    secret edge-t7-secret-0123456789
}
realm * {
    server auth
    accountingServer acct
}
