# 通知は Slack の webhook（S5-11）。URL は secrets/slack-webhook（docs/deployment.md §9.3）。
route:
  receiver: slack
  group_by: [alertname, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack-webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[発生]{{ else }}[解消]{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.node }}（{{ . }}）{{ end }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
