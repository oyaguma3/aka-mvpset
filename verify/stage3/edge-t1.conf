# エッジの代わり（テナント 1）。AP の役（eapaka_test・radclient）から UDP で受け、
# テナントの刻印（Vendor-Specific 32473/1、値は aka-ossbss のテナントの ID "1"）を付けて、aka-radius の auth・acct へ UDP で送る。
ListenUDP *:1812
ListenUDP *:1813
LogLevel 3
# rewrite のブロックは、使う client のブロックより前に書く
rewrite stamp {
    removeVendorAttribute 32473:1
    addVendorAttribute 32473:1:'1
}
client ap {
    type udp
    host 0.0.0.0/0
    secret ap-secret-0123456789
    rewriteIn stamp
}
server auth {
    type udp
    host auth
    port 1812
    secret edge-t1-secret-0123456789
}
server acct {
    type udp
    host acct
    port 1813
    secret edge-t1-secret-0123456789
}
realm * {
    server auth
    accountingServer acct
}
